# D-75 (1), security-39 S-39-04: the fixed notes of tags/scopeItem.jelly (english). Plain text:
# the tag escapes them. They must never name an item or a location.
# Shown after the approved name of a window whose item was renamed or moved where the viewer may not read it.
movedNote=moved; its new location is not visible to you
# Shown instead of the name of such a window whose request is no longer stored (it has no approved name).
hiddenNote=its name is not visible to you
