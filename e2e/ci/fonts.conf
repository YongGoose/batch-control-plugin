<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  e2e-20: one fixed sans-serif face for the browser of the CI e2e pass, so that layout checks (round3 "no h-scroll at
  1280") measure text the way they do locally. Jenkins' font stack starts with system-ui, which Chromium on Linux
  resolves through fontconfig's sans-serif; on the GitHub runner that is DejaVu Sans, noticeably wider than the macOS
  system font, and admin's grants list overflowed 1280 px by 15 px in CI only (2026-10-06/08). Liberation Sans
  (fonts-liberation, installed with Playwright's Chromium dependencies) has Arial's metrics.
  .github/workflows/e2e.yml copies this file to ~/.config/fontconfig/fonts.conf before the shard runs.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
