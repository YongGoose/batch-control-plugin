# B8-R3 variant of profile-role.yaml: an item role that allows Create for names matching team/app-r.*
# and role-based project naming. Applied by hand like profile-role.yaml.
# Applied by hand from Manage Jenkins -> Configuration as Code -> Apply (checklist B19-03);
# not loaded at boot (CASC_JENKINS_CONFIG points at jenkins.yaml only).
jenkins:
  authorizationStrategy:
    batchControlRoleBased:
      roles:
        global:
          - name: admin
            permissions:
              - Overall/Administer
            entries:
              - user: admin
          - name: bc-requester
            permissions:
              - Overall/Read
              - BatchControl/Request
              - BatchControl/RequestGrant
            entries:
              - user: requester
          - name: bc-approver
            permissions:
              - Overall/Read
              - Job/Read
              - BatchControl/Approve
              - BatchControl/ViewHistory
            entries:
              - user: approver-1
        items:
          - name: team-all
            pattern: "team(/.*)?"
            permissions:
              - Job/Read
              - Job/Build
            entries:
              - user: requester
          - name: team-create
            pattern: "team/app-r.*"
            permissions:
              - Job/Create
              - Job/Read
              - Job/Configure
            entries:
              - user: requester
  projectNamingStrategy:
    roleBased:
      forceExistingJobs: false
